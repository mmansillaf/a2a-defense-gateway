http_port 3128

# Definir dominios permitidos (Solo lectura en Moltbook)
acl allowed_domains dstdomain .moltbook.com
acl safe_methods method GET HEAD
acl SSL_ports port 443
acl CONNECT method CONNECT

# Bloquear conexiones a puertos no SSL
http_access deny CONNECT !SSL_ports

# Permitir CONNECT a dominios autorizados
http_access allow CONNECT SSL_ports allowed_domains

# Permitir GET/HEAD a dominios autorizados
http_access allow safe_methods allowed_domains

# Denegar todo lo demás por defecto (Zero-Trust)
http_access deny all

# Deshabilitar caché en disco para evitar persistencia de payloads maliciosos
cache deny all
