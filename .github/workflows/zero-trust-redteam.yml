name: Zero-Trust Multi-Agent Security & Red Team CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  sast-and-redteam-unit:
    name: SAST & Red Team Adversarial Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies & security linters
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt pytest httpx bandit ruff

      - name: Run Bandit SAST Security Audit
        run: |
          bandit -r agents/ -ll -ii

      - name: Execute Red Team Adversarial Pytest Suite
        run: |
          pytest tests/ -v --tb=short

  container-hardening-verification:
    name: Container Hardening & Static Verification
    runs-on: ubuntu-latest
    needs: sast-and-redteam-unit
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Hardened Agent Image
        run: |
          docker build -f agents/Dockerfile.hardened -t moltbook-agent-hardened:ci ./agents

      - name: Verify Non-Root Execution & Read-Only Filesystem
        run: |
          USER_ID=$(docker run --rm --entrypoint id moltbook-agent-hardened:ci -u)
          if [ "$USER_ID" -eq 0 ]; then
            echo "ERROR CRÍTICO: El contenedor corre como root."
            exit 1
          fi
          echo "OK: Contenedor corre bajo UID no privilegiado ($USER_ID)."
